name: Build & Release APK

# 打 tag（v1.0.0 这种）就自动出包并发布 Release，别人点开 Releases 就能下载安装。
# 也可以在 Actions 页面手动 Run workflow，只产出 artifact 不发版。
on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: 检出代码
        uses: actions/checkout@v4

      - name: 安装 JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: 安装 Android SDK
        uses: android-actions/setup-android@v3

      - name: 安装编译用 SDK 平台
        continue-on-error: true
        run: sdkmanager --install "platforms;android-37" "build-tools;37.0.0"

      - name: 改用官方 Gradle 源
        # 仓库里的 distributionUrl 指向腾讯云镜像（给国内用），CI 在国外反而慢
        run: sed -i 's#https://mirrors.cloud.tencent.com/gradle/#https://services.gradle.org/distributions/#' gradle/wrapper/gradle-wrapper.properties

      - name: 写入签名配置
        # ci/classflow-ci.jks 是随仓库公开的自签名密钥，只为保证每个版本签名一致、
        # 老用户能直接覆盖升级。要正式发布请换成自己的密钥。
        run: |
          cat > keystore.properties <<'EOF'
          storeFile=ci/classflow-ci.jks
          storePassword=ClassFlow#2026
          keyAlias=classflow
          keyPassword=ClassFlow#2026
          EOF

      - name: 单元测试
        run: ./gradlew :app:testDebugUnitTest --console=plain

      - name: 构建 Release APK
        run: ./gradlew :app:assembleRelease --console=plain

      - name: 整理产物
        run: |
          VERSION=$(grep -oP 'versionName\s*=\s*"\K[^"]+' app/build.gradle.kts)
          echo "VERSION=$VERSION" >> "$GITHUB_ENV"
          mkdir -p dist
          cp app/build/outputs/apk/release/app-release.apk "dist/ClassFlow-v${VERSION}.apk"
          ls -lh dist

      - name: 上传构建产物（手动运行时也能下载）
        uses: actions/upload-artifact@v4
        with:
          name: ClassFlow-apk
          path: dist/*.apk

      - name: 发布 Release
        if: startsWith(github.ref, 'refs/tags/')
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh release create "$GITHUB_REF_NAME" dist/*.apk \
            --title "ClassFlow $GITHUB_REF_NAME" \
            --notes "## 安装

1. 点下面的 **Assets** 里的 \`ClassFlow-v${VERSION}.apk\` 下载到手机
2. 手机上点开安装（会提示「未知来源」，允许即可）
3. 首次启动按引导登录教务、导入课表

**系统要求**：Android 8.0（API 26）及以上

## 这版有什么

- 周课表 / 今日 / 桌面小组件
- 公文通（需连校园网或学校 VPN）
- 校园地图：C-5 教室分布 + 中德智能制造学院 13 层楼层图，支持房间号搜索

## 注意

- 这是自签名包，不是应用商店版本。以后新版本可以直接覆盖安装，数据不会丢。
- 公文通走校内网地址，校外请先连 VPN。"
